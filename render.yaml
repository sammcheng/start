services:
  - type: web
    name: start
    runtime: docker
    plan: free
    region: oregon
    rootDir: apps/api
    buildFilter:
      paths:
        - apps/api/**
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: hackmarket-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hackmarket-redis
          type: keyvalue
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET_NAME
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: home-accessibility-checker
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/seller-tools/home-accessibility-checker
    buildFilter:
      paths:
        - apps/seller-tools/home-accessibility-checker/**
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: OPENROUTER_TIMEOUT_MS
        value: "20000"

  - type: keyvalue
    name: hackmarket-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction

databases:
  - name: hackmarket-db
    plan: basic_256mb
    region: oregon
    postgresMajorVersion: "16"
